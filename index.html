<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Treasure Tap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2937, #0f172a 60%);
      }

      .game {
        width: min(92vw, 560px);
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 20px;
        padding: 1.25rem;
        box-shadow: 0 12px 24px rgba(2, 6, 23, 0.45);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2.3vw, 1.8rem);
        letter-spacing: 0.04em;
      }

      .status {
        margin: 0.7rem 0 1rem;
        color: #cbd5e1;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.6rem;
      }

      .cell {
        aspect-ratio: 1;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: linear-gradient(145deg, #334155, #1e293b);
        color: #f8fafc;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }

      .cell:hover:enabled {
        transform: translateY(-1px);
        background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      }

      .cell:disabled {
        cursor: default;
        opacity: 0.8;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1rem;
      }

      button#restart {
        border: none;
        border-radius: 10px;
        padding: 0.55rem 0.9rem;
        font-weight: 700;
        background: #22c55e;
        color: #052e16;
        cursor: pointer;
      }

      .hint {
        font-size: 0.93rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="game">
      <h1>Random Treasure Tap</h1>
      <p class="status" id="status">Find the hidden treasure in 6 tries.</p>
      <section class="grid" id="grid" aria-label="Game board"></section>
      <div class="controls">
        <button id="restart" type="button">New Random Game</button>
        <span class="hint">16 tiles · 1 treasure · pure luck</span>
      </div>
    </main>

    <script>
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");
      const restart = document.getElementById("restart");

      const tileCount = 16;
      const maxTries = 6;
      let treasureIndex;
      let tries;
      let gameOver;

      function randomIndex() {
        return Math.floor(Math.random() * tileCount);
      }

      function setStatus(text) {
        status.textContent = text;
      }

      function revealTreasure() {
        const treasureTile = grid.children[treasureIndex];
        if (!treasureTile) return;
        treasureTile.textContent = "💎";
        treasureTile.style.background = "linear-gradient(145deg, #f59e0b, #f97316)";
      }

      function endGame(message) {
        gameOver = true;
        revealTreasure();
        [...grid.children].forEach((tile) => {
          tile.disabled = true;
        });
        setStatus(message);
      }

      function onTileClick(event) {
        if (gameOver) return;
        const tile = event.currentTarget;
        const index = Number(tile.dataset.index);

        tile.disabled = true;
        tries += 1;

        if (index === treasureIndex) {
          tile.textContent = "💎";
          tile.style.background = "linear-gradient(145deg, #22c55e, #16a34a)";
          endGame(`You found it in ${tries} ${tries === 1 ? "try" : "tries"}!`);
          return;
        }

        tile.textContent = "❌";

        if (tries >= maxTries) {
          endGame("No luck this time! Treasure revealed.");
        } else {
          setStatus(`Miss! ${maxTries - tries} tries left.`);
        }
      }

      function createTile(index) {
        const tile = document.createElement("button");
        tile.className = "cell";
        tile.type = "button";
        tile.textContent = "?";
        tile.dataset.index = index;
        tile.addEventListener("click", onTileClick);
        return tile;
      }

      function startGame() {
        grid.innerHTML = "";
        treasureIndex = randomIndex();
        tries = 0;
        gameOver = false;

        for (let i = 0; i < tileCount; i += 1) {
          grid.appendChild(createTile(i));
        }

        setStatus(`Find the hidden treasure in ${maxTries} tries.`);
      }

      restart.addEventListener("click", startGame);
      startGame();
    </script>
  </body>
</html>
