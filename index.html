<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Game Launcher</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        width: min(92vw, 520px);
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 1rem 1.25rem;
        background: #111827;
      }

      a {
        color: #38bdf8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Game Launcher</h1>
      <p>
        To avoid merge conflicts around a shared <code>index.html</code>, the game now lives in a separate file:
        <a href="./shovel-quest.html">Open Shovel Quest</a>.
      </p>
    </main>
  </body>
</html>
